<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VolunSwipe: volunteering that fits your week</title>
<meta name="theme-color" content="#3b4cca">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:wght@600;800&display=swap">
<style>
:root{--bg:#f3f5f9;--card:#fff;--ink:#14213d;--muted:#5b667a;--line:#dde2ec;--blue:#3b4cca;--save:#1f8a57;--skip:#c2410c}
@media(prefers-color-scheme:dark){:root{--bg:#0f1420;--card:#192032;--ink:#edf0f7;--muted:#9aa5bb;--line:#2a344b;--blue:#8c99f5}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 "Atkinson Hyperlegible",system-ui,sans-serif;padding-bottom:84px}
h1,h2{font-family:"Bricolage Grotesque",system-ui,sans-serif;line-height:1.15;margin:0 0 .4em}
header,main{max-width:480px;margin:0 auto;padding:0 18px}
header{padding-top:20px}
h1{font-size:1.7rem;font-weight:800}
header p{margin:0 0 14px;color:var(--muted)}
h2{font-size:1.35rem}
.muted{color:var(--muted)}.center{text-align:center}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
label{display:block;font-weight:700;margin:16px 0 6px}
input,select{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--card)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 14px;border:1.5px solid var(--line);border-radius:99px;background:var(--card)}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.primary{width:100%;margin-top:18px;padding:14px;border:0;border-radius:12px;background:var(--blue);color:#fff;font-weight:700}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;margin-top:14px;padding:6px 0}
.err{color:var(--skip);min-height:1.4em;margin:8px 0 0}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0)}
nav button{flex:1;padding:16px 4px;border:0;background:none;color:var(--muted);font-weight:700}
nav button.on{color:var(--blue);box-shadow:inset 0 3px 0 var(--blue)}
nav button:disabled{opacity:.4;cursor:default}
.stack{position:relative;margin-top:6px;touch-action:pan-y}
.card{position:relative;background:var(--card);border-radius:20px;overflow:hidden;border:1px solid var(--line);box-shadow:0 10px 30px rgba(20,33,61,.12);user-select:none;cursor:grab}
.band{display:flex;justify-content:space-between;padding:12px 18px;color:#fff;font-weight:700}
.body{padding:18px}
.body h2{font-size:1.5rem}
.task{margin:0 0 14px;font-size:1.05rem}
dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0 0 14px}
dt{color:var(--muted)}dd{margin:0}
.why{margin:0;padding:12px 16px;list-style:none;background:var(--bg);border-radius:12px}
.why li+li{margin-top:4px}
.tag{display:inline-block;margin-top:12px;padding:3px 10px;border:1.5px dashed var(--muted);border-radius:8px;color:var(--muted);font-size:.9rem}
.stamp{position:absolute;top:70px;padding:4px 14px;border:3px solid;border-radius:10px;font:800 1.5rem "Bricolage Grotesque",sans-serif;opacity:0;transform:rotate(-8deg);pointer-events:none}
.stamp.save{left:18px;color:var(--save)}.stamp.skip{right:18px;color:var(--skip);transform:rotate(8deg)}
.card[data-dir=save] .stamp.save,.card[data-dir=skip] .stamp.skip{opacity:1}
.actions{display:flex;justify-content:center;gap:34px;margin:22px 0 10px}
.round{width:68px;height:68px;border-radius:50%;border:2.5px solid;background:var(--card);font-size:1.6rem}
.round.skip{color:var(--skip)}.round.yes{color:var(--save)}
.row{display:flex;justify-content:space-between;gap:12px;padding:14px;margin-bottom:10px;background:var(--card);border:1px solid var(--line);border-radius:14px}
.row a{color:var(--blue);font-weight:700}
.col{display:flex;flex-direction:column;gap:8px}
.small{padding:8px 12px;border-radius:9px;border:0;background:var(--blue);color:#fff;font-weight:700}
.small.ghost{background:none;border:1.5px solid var(--line);color:var(--muted)}
.total{margin:4px 0 6px;color:var(--muted)}.total span{font:800 2.6rem "Bricolage Grotesque",sans-serif;color:var(--ink);margin-right:6px}
.empty{padding:40px 0;text-align:center}
.prefbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:0 0 12px;padding:10px 12px;background:var(--card);border:1px solid var(--line);border-radius:12px;font-size:.95rem}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <h1>VolunSwipe</h1>
  <p>Swipe right on volunteering that fits your week.</p>
</header>
<main id="view"></main>
<nav id="tabs" aria-label="Main"></nav>

<script>
/* ============ DATA ============
   EDIT THIS SECTION: replace the sample listings with real, verified ones.
   Set verified:true once you have confirmed the details with the organization. */
const CAUSES = ["Food", "Animals", "Environment", "Education", "Seniors", "Community"];
const CAUSE_COLOR = {Food:"#b84c14", Animals:"#2b7a6a", Environment:"#4d7c0f", Education:"#3b4cca", Seniors:"#a3366b", Community:"#0e7490"};
const DAYS = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
// Approximate town centers (latitude, longitude), used only to estimate distance. No GPS is used.
const TOWNS = {
  "Liberty Hill":[30.664,-97.923], "Leander":[30.579,-97.853], "Cedar Park":[30.505,-97.820],
  "Georgetown":[30.633,-97.678], "Round Rock":[30.508,-97.679], "Burnet":[30.758,-98.228],
  "Taylor":[30.571,-97.409], "Austin":[30.267,-97.743]
};
const SITE = "https://example.org"; // replace with each organization's real sign-up page
const LISTINGS = [
  {id:1, org:"Community food pantry", task:"Sort donations and pack grocery boxes", cause:"Food", town:"Georgetown", days:["Sat"], time:"9am to 12pm", hours:3, minAge:14, link:SITE, verified:false},
  {id:2, org:"Regional food bank warehouse", task:"Help volunteers pack produce", cause:"Food", town:"Austin", days:["Tue","Thu"], time:"4pm to 7pm", hours:3, minAge:16, link:SITE, verified:false},
  {id:3, org:"Weekend meal program", task:"Serve and clean up at a community meal", cause:"Food", town:"Leander", days:["Sun"], time:"11am to 2pm", hours:3, minAge:13, link:SITE, verified:false},
  {id:4, org:"Animal shelter", task:"Walk dogs and socialize cats", cause:"Animals", town:"Georgetown", days:["Sat","Sun"], time:"10am to 1pm", hours:3, minAge:14, link:SITE, verified:false},
  {id:5, org:"Rescue group", task:"Help at adoption events", cause:"Animals", town:"Cedar Park", days:["Sat"], time:"11am to 3pm", hours:4, minAge:13, link:SITE, verified:false},
  {id:6, org:"County park", task:"Trail cleanup and litter pickup", cause:"Environment", town:"Liberty Hill", days:["Sat"], time:"8am to 11am", hours:3, minAge:12, link:SITE, verified:false},
  {id:7, org:"Native plant group", task:"Plant and water native species", cause:"Environment", town:"Round Rock", days:["Sun"], time:"9am to 12pm", hours:3, minAge:12, link:SITE, verified:false},
  {id:8, org:"Creek cleanup crew", task:"Collect trash along the creek", cause:"Environment", town:"Leander", days:["Sat"], time:"9am to 11am", hours:2, minAge:10, link:SITE, verified:false},
  {id:9, org:"Public library", task:"Help kids with summer reading", cause:"Education", town:"Liberty Hill", days:["Mon","Wed"], time:"3:30pm to 5pm", hours:1.5, minAge:14, link:SITE, verified:false},
  {id:10, org:"After-school tutoring program", task:"Tutor elementary students in math", cause:"Education", town:"Cedar Park", days:["Tue","Thu"], time:"4pm to 6pm", hours:2, minAge:15, link:SITE, verified:false},
  {id:11, org:"Senior center", task:"Play games and visit with residents", cause:"Seniors", town:"Georgetown", days:["Wed","Fri"], time:"2pm to 4pm", hours:2, minAge:14, link:SITE, verified:false},
  {id:12, org:"Home-delivered meals route", task:"Deliver meals with an adult driver", cause:"Seniors", town:"Round Rock", days:["Mon","Fri"], time:"10am to 12pm", hours:2, minAge:16, link:SITE, verified:false},
  {id:13, org:"Neighborhood clothing closet", task:"Sort and organize donated clothes", cause:"Community", town:"Liberty Hill", days:["Sat"], time:"1pm to 4pm", hours:3, minAge:12, link:SITE, verified:false},
  {id:14, org:"Community event team", task:"Set up and run a local festival booth", cause:"Community", town:"Burnet", days:["Sat","Sun"], time:"10am to 2pm", hours:4, minAge:13, link:SITE, verified:false}
];

/* ============ STATE (saved only in this browser) ============ */
let state = {prefs:null, seen:[], saved:[], hours:[]};
let tab = "discover", draft = null, prefillOrg = "", current = null, armed = false;
function load(){ try{ const s = localStorage.getItem("volunswipe"); if(s) state = Object.assign(state, JSON.parse(s)); }catch(e){} }
function save(){ try{ localStorage.setItem("volunswipe", JSON.stringify(state)); }catch(e){} }
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ============ MATCHING ALGORITHM ============
   Each listing gets a score out of 100:
     40 points  if its cause is one the student picked
     30 points  for distance (full points in the same town, falling to 0 at the student's travel limit)
     30 points  for schedule (share of the listing's days that are free days for the student)
   Listings beyond the travel limit are removed. The rest are shown best match first. */
function miles(a, b){
  const R = 3959, t = x => x * Math.PI / 180;           // haversine distance formula
  const dLat = t(b[0]-a[0]), dLon = t(b[1]-a[1]);
  const h = Math.sin(dLat/2)**2 + Math.cos(t(a[0])) * Math.cos(t(b[0])) * Math.sin(dLon/2)**2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
function score(l, p){
  const d = miles(TOWNS[p.town], TOWNS[l.town]);
  const shared = l.days.filter(x => p.days.includes(x));
  const causePts = p.causes.includes(l.cause) ? 40 : 0;
  const distPts = Math.max(0, 30 * (1 - d / p.maxMiles));
  const dayPts = 30 * shared.length / l.days.length;
  const why = [
    p.causes.includes(l.cause) ? "Matches your interest in " + l.cause.toLowerCase() : l.cause + " is not one of your picks",
    d < 1 ? "In your town" : Math.round(d) + " miles from " + p.town,
    shared.length ? "Open " + shared.join(" and ") + ", when you are free" : "Not on your free days"
  ];
  return {total: Math.round(causePts + distPts + dayPts), d: Math.round(d), why};
}
function deck(){
  const p = state.prefs;
  return LISTINGS.filter(l => !state.seen.includes(l.id) && !state.saved.includes(l.id))
    .map(l => ({l, s: score(l, p)})).filter(x => x.s.d <= p.maxMiles)
    .sort((a, b) => b.s.total - a.s.total);
}

/* ============ SCREENS ============ */
function render(){
  if(!state.prefs) tab = "settings";
  $("#tabs").innerHTML = [["discover","Discover"],["matches","Matches ("+savedItems().length+")"],["hours","Hours"],["settings","Preferences"]]
    .map(([k,n]) => `<button class="${tab===k?"on":""}" onclick="go('${k}')" ${!state.prefs && k!=="settings" ? "disabled" : ""}>${n}</button>`).join("");
  ({discover:viewDiscover, matches:viewMatches, hours:viewHours, settings:viewSettings})[tab]();
}
function go(t){ if(t !== "settings") draft = null; tab = t; render(); }
function savedItems(){ return state.saved.map(id => LISTINGS.find(l => l.id === id)).filter(Boolean); }
function showSkipped(){ state.seen = []; draft = null; save(); go("discover"); }
function cancelSettings(){ draft = null; go("discover"); }

function viewSettings(){
  if(!draft) draft = JSON.parse(JSON.stringify(state.prefs || {causes:[], days:[], town:"Liberty Hill", maxMiles:15}));
  $("#view").innerHTML = `
    <h2>${state.prefs ? "Your preferences" : "Set up your preferences"}</h2>
    <p class="muted">Saved only on this device. No account, no name, no location tracking.</p>
    <label>Causes you care about</label>
    <div class="chips">${CAUSES.map(c => chip("causes", c)).join("")}</div>
    <label>Days you are free</label>
    <div class="chips">${DAYS.map(d => chip("days", d)).join("")}</div>
    <label for="town">Nearest town</label>
    <select id="town" onchange="draft.town=this.value">${Object.keys(TOWNS).map(t => `<option ${t===draft.town?"selected":""}>${t}</option>`).join("")}</select>
    <label for="mi">How far can you travel?</label>
    <select id="mi" onchange="draft.maxMiles=+this.value">${[5,10,15,25,40].map(m => `<option value="${m}" ${m===draft.maxMiles?"selected":""}>${m} miles</option>`).join("")}</select>
    <p id="err" class="err" role="alert"></p>
    <button class="primary" onclick="savePrefs()">Save and start swiping</button>
    ${state.prefs ? '<div><button class="link" onclick="cancelSettings()">Cancel</button></div><div><button class="link" onclick="showSkipped()">Show skipped places again</button></div><div><button class="link" onclick="resetAll(this)">Erase all my data</button></div>' : ""}`;
}
function chip(k, v){ return `<button class="chip ${draft[k].includes(v)?"on":""}" aria-pressed="${draft[k].includes(v)}" onclick="toggle('${k}','${v}')">${v}</button>`; }
function toggle(k, v){ const a = draft[k], i = a.indexOf(v); i < 0 ? a.push(v) : a.splice(i, 1); viewSettings(); }
function savePrefs(){
  if(!draft.causes.length || !draft.days.length){ $("#err").textContent = "Pick at least one cause and one free day."; return; }
  state.prefs = draft; draft = null; state.seen = []; save(); go("discover");
}
function resetAll(btn){
  if(!armed){ armed = true; btn.textContent = "Tap again to erase everything"; return; }
  armed = false; state = {prefs:null, seen:[], saved:[], hours:[]}; draft = null; save(); go("settings");
}

function viewDiscover(){
  const d = deck();
  if(!d.length){
    current = null;
    $("#view").innerHTML = `<div class="empty"><h2>You have seen everything nearby</h2><p class="muted">Change your preferences to widen the search, or bring back the places you skipped.</p>
      <button class="primary" onclick="go('settings')">Change my preferences</button>
      <button class="link" onclick="showSkipped()">Show skipped places again</button></div>`;
    return;
  }
  const {l, s} = d[0]; current = l;
  const p = state.prefs;
  $("#view").innerHTML = `
    <div class="prefbar"><span>${esc(p.causes.join(", "))} within ${p.maxMiles} miles of ${esc(p.town)}</span><button class="small ghost" onclick="go('settings')">Change</button></div>
    <div class="stack">
      <article class="card" id="card" aria-label="${esc(l.org)}">
        <div class="band" style="background:${CAUSE_COLOR[l.cause]}"><span>${l.cause}</span><span>${s.total}% match</span></div>
        <div class="body">
          <h2>${esc(l.org)}</h2>
          <p class="task">${esc(l.task)}</p>
          <dl>
            <dt>When</dt><dd>${l.days.join(", ")}, ${esc(l.time)}</dd>
            <dt>Where</dt><dd>${esc(l.town)}, ${s.d} miles away</dd>
            <dt>Time</dt><dd>About ${l.hours} hours</dd>
            <dt>Age</dt><dd>${l.minAge} and up</dd>
          </dl>
          <ul class="why">${s.why.map(w => `<li>${w}</li>`).join("")}</ul>
          ${l.verified ? "" : '<span class="tag">Sample listing, not yet verified</span>'}
        </div>
        <div class="stamp save">Save</div><div class="stamp skip">Skip</div>
      </article>
    </div>
    <div class="actions">
      <button class="round skip" onclick="decide(false)" aria-label="Skip this opportunity">✕</button>
      <button class="round yes" onclick="decide(true)" aria-label="Save this opportunity">♥</button>
    </div>
    <p class="muted center">${d.length} left. Swipe right to save, left to skip.</p>`;
  attachDrag($("#card"));
}
function attachDrag(el){
  let sx = 0, dx = 0, drag = false;
  el.onpointerdown = e => { drag = true; sx = e.clientX; el.setPointerCapture(e.pointerId); el.style.transition = "none"; };
  el.onpointermove = e => {
    if(!drag) return;
    dx = e.clientX - sx;
    el.style.transform = `translateX(${dx}px) rotate(${dx/20}deg)`;
    el.dataset.dir = dx > 40 ? "save" : dx < -40 ? "skip" : "";
  };
  el.onpointerup = el.onpointercancel = () => {
    if(!drag) return; drag = false;
    if(Math.abs(dx) > 100){ decide(dx > 0); }
    else { el.style.transition = "transform .2s"; el.style.transform = ""; el.dataset.dir = ""; }
    dx = 0;
  };
}
function decide(yes){
  const el = $("#card");
  if(!el || !current) return;
  const id = current.id; current = null;
  el.style.transition = "transform .25s, opacity .25s";
  el.style.transform = `translateX(${yes?500:-500}px) rotate(${yes?25:-25}deg)`;
  el.style.opacity = 0;
  setTimeout(() => { (yes ? state.saved : state.seen).push(id); save(); render(); }, 220);
}
document.addEventListener("keydown", e => {
  if(tab !== "discover") return;
  if(e.key === "ArrowRight") decide(true);
  if(e.key === "ArrowLeft") decide(false);
});

function viewMatches(){
  const items = savedItems();
  $("#view").innerHTML = "<h2>My matches</h2>" + (items.length ? items.map(l => `
    <div class="row">
      <div>
        <strong>${esc(l.org)}</strong>
        <div>${esc(l.task)}</div>
        <div class="muted">${l.days.join(", ")}, ${esc(l.time)} in ${esc(l.town)}</div>
        <a href="${esc(l.link)}" target="_blank" rel="noopener">Sign up with the organization</a>
      </div>
      <div class="col">
        <button class="small" onclick="logFrom(${l.id})">Log hours</button>
        <button class="small ghost" onclick="unsave(${l.id})">Remove</button>
      </div>
    </div>`).join("") : '<p class="muted">Nothing saved yet. Swipe right on an opportunity you like.</p>');
}
function logFrom(id){ prefillOrg = LISTINGS.find(l => l.id === id).org; go("hours"); }
function unsave(id){ state.saved = state.saved.filter(x => x !== id); state.seen.push(id); save(); render(); }

function viewHours(){
  const total = state.hours.reduce((a, h) => a + h.hrs, 0);
  $("#view").innerHTML = `
    <h2>Hours tracker</h2>
    <div class="total"><span>${total}</span>hours logged</div>
    <label for="ho">Organization</label><input id="ho" maxlength="60" value="${esc(prefillOrg)}">
    <label for="hh">Hours</label><input id="hh" type="number" min="0.5" max="24" step="0.5" value="2">
    <label for="hd">Date</label><input id="hd" type="date" value="${new Date().toISOString().slice(0,10)}">
    <p id="err" class="err" role="alert"></p>
    <button class="primary" onclick="addHours()">Add hours</button>
    <div style="margin-top:20px">${state.hours.slice().reverse().map(h => `
      <div class="row"><div><strong>${esc(h.org)}</strong><div class="muted">${esc(h.date)}, ${h.hrs} hours</div></div>
      <button class="small ghost" onclick="delHours(${h.id})">Delete</button></div>`).join("")}</div>`;
  prefillOrg = "";
}
function addHours(){
  const org = $("#ho").value.trim(), hrs = parseFloat($("#hh").value), date = $("#hd").value;
  if(!org || !(hrs > 0 && hrs <= 24) || !date){ $("#err").textContent = "Enter the organization, hours between 0.5 and 24, and a date."; return; }
  state.hours.push({id: Date.now(), org, hrs, date}); save(); viewHours();
}
function delHours(id){ state.hours = state.hours.filter(h => h.id !== id); save(); viewHours(); }

load(); render();
</script>
</body>
</html>
